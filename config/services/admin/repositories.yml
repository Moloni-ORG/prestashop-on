services:
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  molonion.repository.orders:
    public: true
    class: MoloniOn\Repository\OrdersRepository
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  molonion.repository.products:
    public: true
    class: MoloniOn\Repository\ProductsRepository
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  molonion.repository.settings:
    public: true
    class: MoloniOn\Repository\MoloniSettingsRepository
    factory: [ '@doctrine.orm.default_entity_manager', getRepository ]
    arguments:
      - MoloniOn\Entity\MoloniOnSettings
