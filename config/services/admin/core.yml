services:
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  molonion.context:
    class: MoloniOn\MoloniContext
    public: true
    arguments:
      - "@doctrine.orm.entity_manager"
      - '@router'
      - '@translator'

  # PrestaShop 9 registers every FrameworkBundleAdminController subclass as an autowired service,
  # including the abstract MoloniController, so the class name must resolve to the context service
  MoloniOn\MoloniContext: '@molonion.context'
